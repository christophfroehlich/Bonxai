bonxai_server_node:
  ros__parameters:
    resolution: 0.02
    frame_id: "map"
    base_frame_id: "base_footprint"
    use_separate_free_cloud: false
    cloud_sync_queue_size: 100

    occupancy_min_z: -100.0
    occupancy_max_z: 100.0

    sensor_model:
      max_range: -1.0
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97

    latch: false
